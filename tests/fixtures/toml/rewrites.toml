[general]

root = "tests/fixtures/public"

[advanced]

# Glob groups 1
[[advanced.rewrites]]
source = "**/error-page.{html}"
destination = "/404.$2"

# Glob groups 2
[[advanced.rewrites]]
source = "/error-page/{404,50x}.html"
destination = "/$1.html"

# Glob groups 3
[[advanced.rewrites]]
source = "/errors/{50}x.html"
destination = "/$1x.html"

# Glob groups 4
[[advanced.rewrites]]
source = "/scripts/{*}.{js,mjs}"
destination = "/assets/$1.$2"

# Glob groups recursive 1
[[advanced.rewrites]]
source = "/recursive/{**}"
destination = "/$1"
