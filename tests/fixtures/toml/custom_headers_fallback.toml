[general]

root = "tests/fixtures/public"

[advanced]

[[advanced.headers]]
source = "**/*.html"
headers = { Cache-Control = "no-store", X-App-Shell = "yes" }

[[advanced.headers]]
source = "**/*.css"
headers = { X-Css-Only = "yes" }

[[advanced.headers]]
source = "/assets/**"
headers = { X-Under-Assets = "yes" }
