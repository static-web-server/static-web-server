[advanced]

[[advanced.headers]]
source = "/assets/**"
headers = { X-Custom-Header = "every-response" }

[[advanced.headers]]
source = "/assets/**"
status = [200, 206, 304]
headers = { Cache-Control = "public, max-age=31536000, immutable", X-Status-Filtered = "1" }

[[advanced.headers]]
source = "/assets/**"
status = [418]
headers = { X-Teapot = "1" }
