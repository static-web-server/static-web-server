layers:
- name: Entry
  description: Process entry points, listeners, hyper service
  workspace_paths:
  - - static-web-server
    - winservice
  - - static-web-server
    - server
  - - static-web-server
    - service
  - - static-web-server
    - testing
- name: Pipeline
  description: Request pipeline orchestration
  workspace_paths:
  - - static-web-server
    - handler
- name: Features
  description: One module per request/response feature
  workspace_paths:
  - - static-web-server
    - access_logs
  - - static-web-server
    - basic_auth
  - - static-web-server
    - compression
  - - static-web-server
    - compression_static
  - - static-web-server
    - control_headers
  - - static-web-server
    - cors
  - - static-web-server
    - custom_headers
  - - static-web-server
    - directory_listing
  - - static-web-server
    - etag
  - - static-web-server
    - fallback_page
  - - static-web-server
    - health
  - - static-web-server
    - log_addr
  - - static-web-server
    - maintenance_mode
  - - static-web-server
    - markdown
  - - static-web-server
    - mem_cache
  - - static-web-server
    - metrics
  - - static-web-server
    - redirects
  - - static-web-server
    - response
  - - static-web-server
    - rewrites
  - - static-web-server
    - security_headers
  - - static-web-server
    - static_files
  - - static-web-server
    - text_charset
  - - static-web-server
    - virtual_hosts
- name: Config
  description: Parsed settings and handler options
  workspace_paths:
  - - static-web-server
    - settings
  - - static-web-server
    - handler_opts
- name: Foundation
  description: Shared helpers with no feature knowledge
  workspace_paths:
  - - static-web-server
    - lib
  - - static-web-server
    - error_page
  - - static-web-server
    - fs
  - - static-web-server
    - exts
  - - static-web-server
    - conditional_headers
  - - static-web-server
    - https_redirect
  - - static-web-server
    - body
  - - static-web-server
    - error
  - - static-web-server
    - helpers
  - - static-web-server
    - logger
  - - static-web-server
    - signals
  - - static-web-server
    - tls
rules:
- from:
    layer: Entry
  to:
    layer: Entry
- from:
    layer: Entry
  to:
    layer: Pipeline
- from:
    layer: Entry
  to:
    layer: Features
- from:
    layer: Entry
  to:
    layer: Config
- from:
    layer: Entry
  to:
    layer: Foundation
- from:
    layer: Pipeline
  to:
    layer: Features
- from:
    layer: Pipeline
  to:
    layer: Config
- from:
    layer: Pipeline
  to:
    layer: Foundation
- from:
    layer: Features
  to:
    layer: Features
- from:
    layer: Features
  to:
    layer: Config
- from:
    layer: Features
  to:
    layer: Foundation
- from:
    layer: Config
  to:
    layer: Config
- from:
    layer: Config
  to:
    layer: Foundation
- from:
    layer: Foundation
  to:
    layer: Foundation
- from:
    workspace_path:
    - static-web-server
  to:
    workspace_path:
    - static-web-server
